name: Release

# On a `vX.Y.Z` tag: checks, build, then publication on PyPI through trusted publishing (OIDC — no token, no secret).
# The PyPI project must trust this repository and this workflow (CONTRIBUTING.md › Release).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Build & publish on PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bitgen-sdk/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: The tag must be the version of the package
        run: |
          version="$(sed -nE 's/^VERSION = "(.+)"$/\1/p' src/bitgen/version.py)"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} is not v${version} (src/bitgen/version.py)"; exit 1; }

      - name: Install the package and the tools
        run: python -m pip install --quiet -e '.[dev]'

      - name: Checks
        run: ruff check && ruff format --check && mypy && pytest

      - name: Build the sdist and the wheel
        run: python -m build && twine check dist/*

      - name: Publish on PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
