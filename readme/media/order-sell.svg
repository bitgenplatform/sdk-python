<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="title">
  <title id="title">Sale (SELL): the states of an order, FAILED and PARKED</title>
  <defs>
    <marker id="mcbd5e1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L7,4 L0,7.5 z" fill="#cbd5e1"/></marker>
    <marker id="m0d9488" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L7,4 L0,7.5 z" fill="#0d9488"/></marker>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#e2e8f0"/></pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1000" height="290" fill="#ffffff"/>
  <rect width="1000" height="290" fill="url(#grid)"/>
  <circle cx="461" cy="30" r="5" fill="#0d9488"/>
  <text x="471.9" y="34.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Sale</text>
  <rect x="509" y="18" width="51" height="24" rx="12.0" fill="#f1f5f9"/>
  <text x="534.7" y="34.1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">SELL</text>
  <path d="M238,96 H274" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0d9488)"/>
  <path d="M392,96 H428" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0d9488)"/>
  <path d="M525,96 H561" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0d9488)"/>
  <path d="M658,96 H694" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0d9488)"/>
  <path d="M769,96 H805" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0d9488)"/>
  <rect x="136" y="81" width="100" height="30" rx="15.0" fill="#eef2ff"/>
  <text x="186.0" y="100.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#4338ca" text-anchor="middle">REGISTERED</text>
  <rect x="276" y="81" width="114" height="30" rx="15.0" fill="#eef2ff"/>
  <text x="333.2" y="100.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#4338ca" text-anchor="middle">TRANSFERRING</text>
  <rect x="430" y="81" width="93" height="30" rx="15.0" fill="#eef2ff"/>
  <text x="476.8" y="100.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#4338ca" text-anchor="middle">DEPOSITED</text>
  <rect x="563" y="81" width="93" height="30" rx="15.0" fill="#eef2ff"/>
  <text x="609.6" y="100.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#4338ca" text-anchor="middle">EXECUTING</text>
  <rect x="696" y="81" width="71" height="30" rx="15.0" fill="#eef2ff"/>
  <text x="731.6" y="100.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#4338ca" text-anchor="middle">FILLED</text>
  <rect x="807" y="81" width="57" height="30" rx="15.0" fill="#dcfce7"/>
  <text x="835.6" y="100.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">DONE</text>
  <path d="M186,113 V134 Q186,140 192,140 H370 Q376,140 376,146 V171" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#mcbd5e1)"/>
  <path d="M333,113 V134 Q333,140 339,140 H370 Q376,140 376,146 V171" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#mcbd5e1)"/>
  <path d="M598,113 V134 Q598,140 592,140 H382 Q376,140 376,146 V171" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#mcbd5e1)"/>
  <path d="M622,113 V148 Q622,154 628,154 H804 Q810,154 810,160 V171" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#mcbd5e1)"/>
  <rect x="341" y="173" width="71" height="30" rx="15.0" fill="#fee2e2"/>
  <text x="376.3" y="192.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">FAILED</text>
  <rect x="774" y="173" width="71" height="30" rx="15.0" fill="#fef3c7"/>
  <text x="809.6" y="192.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">PARKED</text>
  <text x="376.3" y="220.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Failed before anything was received:</text>
  <text x="376.3" y="235.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">never launched, custody transfer failed,</text>
  <text x="376.3" y="250.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">or refused or failed by the exchange.</text>
  <text x="376.3" y="265.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">The crypto goes back to the wallet.</text>
  <text x="809.6" y="220.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Executed, but nothing of the target</text>
  <text x="809.6" y="235.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">asset was received;</text>
  <text x="809.6" y="250.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">the BITGEN team takes over.</text>
</svg>
