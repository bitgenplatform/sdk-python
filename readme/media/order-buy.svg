  <rect x="286" y="173" width="71" height="30" rx="15.0" fill="#fee2e2"/>
  <text x="321.8" y="192.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">FAILED</text>
  <rect x="556" y="173" width="71" height="30" rx="15.0" fill="#fef3c7"/>
  <text x="592.0" y="192.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">PARKED</text>
  <text x="321.8" y="220.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Failed before anything was received:</text>
  <text x="321.8" y="235.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">never launched, or refused or failed</text>
  <text x="321.8" y="250.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">by the exchange.</text>
  <text x="321.8" y="265.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">The EUR reserve is released.</text>
  <text x="592.0" y="220.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Executed, but nothing of the target</text>
  <text x="592.0" y="235.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">asset was received;</text>
  <text x="592.0" y="250.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">the BITGEN team takes over.</text>
</svg>
