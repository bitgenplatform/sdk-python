  <text x="460.8" y="34.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Purchase</text>
  <rect x="528" y="18" width="44" height="24" rx="12.0" fill="#f1f5f9"/>
  <text x="549.4" y="34.1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">BUY</text>
  <path d="M304,96 H344" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m7c3aed)"/>
  <path d="M440,96 H480" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m7c3aed)"/>
  <path d="M556,96 H596" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m7c3aed)"/>
  <path d="M700,96 H740" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m7c3aed)"/>
  <rect x="202" y="81" width="100" height="30" rx="15.0" fill="#eef2ff"/>
  <text x="251.6" y="100.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#4338ca" text-anchor="middle">REGISTERED</text>
  <rect x="346" y="81" width="93" height="30" rx="15.0" fill="#eef2ff"/>
  <text x="392.0" y="100.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#4338ca" text-anchor="middle">EXECUTING</text>
  <rect x="482" y="81" width="71" height="30" rx="15.0" fill="#eef2ff"/>
  <text x="518.0" y="100.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#4338ca" text-anchor="middle">FILLED</text>
  <rect x="598" y="81" width="100" height="30" rx="15.0" fill="#eef2ff"/>
  <text x="647.6" y="100.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#4338ca" text-anchor="middle">DELIVERING</text>
  <rect x="742" y="81" width="57" height="30" rx="15.0" fill="#dcfce7"/>
  <text x="770.0" y="100.3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">DONE</text>
  <path d="M252,113 V134 Q252,140 258,140 H316 Q322,140 322,146 V171" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#mcbd5e1)"/>
  <path d="M380,113 V134 Q380,140 374,140 H328 Q322,140 322,146 V171" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#mcbd5e1)"/>
